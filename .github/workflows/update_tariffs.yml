name: Update Electricity Tariffs

on:
  schedule:
    # Run daily at 06:00 UTC (07:00 Irish time)
    - cron: "0 6 * * *"
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # `shell: bash` is load-bearing. GitHub's default for `run` on Linux is
      # `bash -e {0}` — with -e but WITHOUT pipefail — so `python … | tee` exits
      # with tee's status and throws the scraper's away. That is not
      # theoretical: the 28 July run verified 6 of 25 plans (24%, against a 60%
      # floor), the coverage gate called sys.exit(1), the step was recorded as a
      # success, and a branch of barely-checked rates was pushed for review. The
      # one guard written to stop rates going stale silently was disabled by the
      # pipe added to capture its own log.
      - name: Run tariff scraper
        shell: bash
        run: |
          set -o pipefail
          python scraper/scrape_tariffs.py 2>&1 | tee scrape.log

      # A scraped rate is a number a stranger's markup handed us, and it lands
      # in a payback figure somebody spends ten thousand euro on. It used to be
      # committed straight to main and deployed within the minute, unreviewed.
      # A pull request costs one glance a day and puts a human between a
      # misparsed decimal point and a recommendation.
      #
      # This step is deliberately not `if: always()`. When the coverage gate
      # fails, the run is red and there is nothing worth merging — a PR
      # containing only a fresh timestamp over unverified rates is exactly the
      # false reassurance this whole change exists to remove.
      # Opening the PR needs "Allow GitHub Actions to create and approve pull
      # requests" (Settings → Actions → General). Without it the API returns
      # "GitHub Actions is not permitted to create or approve pull requests" and
      # the job goes red — after the branch has already been pushed successfully.
      # The branch is the deliverable, so a blocked PR is a setting to change,
      # not a failed scrape, and it must not look like one. The link to open it
      # by hand is written to the run summary below.
      - name: Open a pull request with the new rates
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: public/tariffs.json
          branch: tariffs/auto-update
          commit-message: "chore: update electricity tariffs"
          title: "Tariff update — review the numbers before merging"
          labels: tariffs
          delete-branch: true
          body: |
            Automated scrape from the supplier sites.

            **Check before merging:** every changed rate against the diff. A
            wrong number here reaches a recommendation, and the app presents it
            as verified.

            The full run log — which pages were discovered, what each supplier
            yielded, and which links are broken — is attached to
            [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            as the `scrape-log` artifact.

      - name: Say where the rates are
        if: always()
        shell: bash
        run: |
          {
            if [ "${{ steps.pr.outcome }}" = "success" ]; then
              echo "### Tariff update ready for review"
              echo "Pull request: ${{ steps.pr.outputs.pull-request-url }}"
            else
              echo "### Tariff update pushed, but the pull request could not be opened"
              echo ""
              echo "The rates are on the \`tariffs/auto-update\` branch. Open the PR here:"
              echo ""
              echo "https://github.com/${{ github.repository }}/compare/main...tariffs/auto-update?expand=1"
              echo ""
              echo "To let the job open it itself, enable **Settings → Actions → General →"
              echo "Workflow permissions → Allow GitHub Actions to create and approve pull requests**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A red tab is not a notification.
      #
      # The coverage gate has been doing its job since late July 2026 — it
      # failed every run, refused to open a pull request over unverified rates,
      # and stopped a fresh timestamp being written across stale numbers. It
      # worked perfectly and nobody found out for a month, because the only
      # place it said so was a workflow list nobody opens on a repository with
      # no failing checks anywhere else.
      #
      # An issue is the cheapest thing that actually reaches a person: GitHub
      # emails the owner when one is opened, it stays open until the scrape
      # works again, and re-runs comment on the existing issue instead of
      # opening a new one every morning.
      - name: Raise an issue when the scrape could not verify the rates
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Tariff scrape is failing \u2014 rates are going stale';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The daily tariff scrape did not verify enough plans to be trusted, so no',
              'pull request was opened and `public/tariffs.json` still holds the previous',
              'rates.',
              '',
              'Every day this stays open, the app presents older numbers as current. The',
              'per-supplier lines in the run log say which half broke: `NO PAGE REACHED`',
              'means discovery needs a new seed URL, `nothing recognisable` means the',
              'parser needs updating.',
              '',
              `Run: ${run}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'tariffs',
            });
            const existing = open.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing. Run: ${run}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['tariffs'],
              });
            }

      # The counterpart: when a scrape succeeds again, say so and close the
      # issue, so an open one always means "the rates are not being checked".
      - name: Close the staleness issue once the scrape works again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Tariff scrape is failing \u2014 rates are going stale';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'tariffs',
            });
            const existing = open.find(i => i.title === title);
            if (!existing) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number,
              body: 'The scrape verified enough plans again \u2014 closing.',
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, state: 'closed',
            });

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: scrape.log
          retention-days: 30
          if-no-files-found: ignore
