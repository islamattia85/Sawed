name: Update Electricity Tariffs

on:
  schedule:
    # Run daily at 06:00 UTC (07:00 Irish time)
    - cron: "0 6 * * *"
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run tariff scraper
        run: python scraper/scrape_tariffs.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet tariffs.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push updated tariffs
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "tariff-bot[bot]"
          git config user.email "tariff-bot@users.noreply.github.com"
          git add tariffs.json
          git commit -m "chore: auto-update electricity tariffs $(date -u '+%Y-%m-%d')"
          git push
