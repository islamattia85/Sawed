name: Diagnose Tariff Scraper

# The supplier sites are unreachable from the dev container, so this runner is
# the only place their live markup can be read. It prints; it never writes
# tariffs.json and never opens a pull request.

on:
  push:
    branches:
      - 'fix/scraper-**'
    paths:
      - 'scraper/**'
      - '.github/workflows/diagnose_scraper.yml'
  workflow_dispatch:
    inputs:
      suppliers:
        description: 'Space-separated first words, e.g. "bord sse". Empty = all.'
        required: false
        default: ''
      deep:
        description: 'Deep-probe keys, e.g. "bg sse". Empty = all.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r scraper/requirements.txt
      - name: Probe supplier sites
        working-directory: scraper
        run: python diagnose.py ${{ github.event.inputs.suppliers }}
      - name: Deep probe (targeted parser design)
        working-directory: scraper
        run: python diagnose_deep.py ${{ github.event.inputs.deep }}
      - name: Dry-run the real scraper (coverage, writes nothing)
        working-directory: scraper
        run: python scrape_tariffs.py --dry-run
