<!-- Fonts are served from our own origin. The Google Fonts stylesheet was
     render-blocking, so when that CDN was slow or unreachable — corporate
     networks, hotel wifi, several national firewalls — the page painted
     nothing at all for 13 seconds, against 308ms when it resolved. That is a
     total outage caused by a decorative dependency we do not control.
     Two variable woff2 files, latin subset, 76 KB the browser can cache. -->
<link rel="preload" href="/fonts/InterTight.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin>
<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>

<link rel="stylesheet" href="/src/styles/v7.css">

<body>
<div class="app" id="app-root"><div id="loader" hidden></div></div>

<!-- Launch splash: painted before any script runs, faded out by main.js once
     the first screen is drawn. Never blocks a tap. -->
<div id="pk-splash" aria-hidden="true">
  <svg class="pk-splash-mark" viewBox="0 0 24 24" fill="none" stroke-linecap="round">
    <path class="pk-arc" d="M3 16 C7 16 8 7 12 7 C16 7 17 16 21 16" stroke="#5a7880" stroke-width="1.3" stroke-dasharray="1.4 2.4"/>
    <path class="pk-line" d="M3 16 H21" stroke="#ffd166" stroke-width="2"/>
  </svg>
  <div class="pk-splash-word"><b>peak</b>less</div>
</div>
<style>
  #pk-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#16343d;pointer-events:none;transition:opacity .35s ease}
  #pk-splash.is-gone{opacity:0}
  .pk-splash-mark{width:96px;height:96px}
  .pk-line{stroke-dasharray:18;stroke-dashoffset:18;animation:pk-draw .7s .15s cubic-bezier(.3,.7,.2,1) forwards}
  .pk-arc{opacity:0;animation:pk-in .4s forwards}
  .pk-splash-word{font:500 32px/1 "Inter Tight",system-ui,sans-serif;letter-spacing:-.03em;color:#e8eef0;opacity:0;animation:pk-in .4s .45s forwards}
  .pk-splash-word b{font-weight:800}
  @keyframes pk-draw{to{stroke-dashoffset:0}}
  @keyframes pk-in{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.pk-line,.pk-arc,.pk-splash-word{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
