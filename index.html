<!-- Fonts are served from our own origin. The Google Fonts stylesheet was
     render-blocking, so when that CDN was slow or unreachable — corporate
     networks, hotel wifi, several national firewalls — the page painted
     nothing at all for 13 seconds, against 308ms when it resolved. That is a
     total outage caused by a decorative dependency we do not control.
     Two variable woff2 files, latin subset, 76 KB the browser can cache. -->
<link rel="preload" href="/fonts/InterTight.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin>
